[workspace]
members = ["crates/domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.dependencies]
clap = "4.6.9"
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.2.2"
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
