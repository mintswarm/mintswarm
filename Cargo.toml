[workspace]
members = ["crates/domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "FSL-1.1-ALv2"

[workspace.dependencies]

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
