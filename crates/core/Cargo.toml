[package]
name = "mintswarm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Short-lived Postgres instances for tests, in `mintswarm_core::testing::pg`. Enabled only
# explicitly: no self dev-dependency turns it on, so workspace-wide test and lint runs need no
# Postgres.
pg-tests = ["dep:tokio", "dep:tempfile", "dep:rustix"]

[dependencies]
chacha20poly1305 = { workspace = true }
deadpool-postgres = { workspace = true }
mintswarm-config = { path = "../config" }
mintswarm-domain = { path = "../domain" }
mintswarm-github = { path = "../github" }
mintswarm-proto = { path = "../proto" }
mintswarm-rules = { path = "../rules" }
rustix = { workspace = true, features = ["process"], optional = true }
serde_json = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync"], optional = true }
tokio-postgres = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
