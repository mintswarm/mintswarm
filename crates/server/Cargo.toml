[package]
name = "mintswarm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mintswarm-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
clap = { workspace = true, features = ["derive"] }
hmac = { workspace = true }
mintswarm-config = { path = "../config" }
mintswarm-core = { path = "../core" }
mintswarm-domain = { path = "../domain" }
mintswarm-github = { path = "../github" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "io-util", "test-util"] }
tokio-stream = { workspace = true }
tower = { workspace = true }
