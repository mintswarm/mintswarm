[package]
name = "mintswarm-github"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jsonwebtoken = { workspace = true }
mintswarm-domain = { path = "../domain" }
reqwest = { workspace = true }
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "io-util", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
mintswarm-config = { path = "../config" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "test-util"] }

[lints]
workspace = true
