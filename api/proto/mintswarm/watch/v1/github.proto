syntax = "proto3";

package mintswarm.watch.v1;

import "mintswarm/watch/v1/common.proto";

// The body of a `github.webhook` event: one verified GitHub webhook
// delivery.
//
// One normaliser maps a verified delivery to the envelope and this body. The
// envelope's `subject` is the issue or pull request, with its title; for an
// `issue_dependencies` delivery it is the issue in `repository`, the side the
// delivery was sent for. `actor` is the delivery's `sender`; `parties` are the
// item's author, assignees and requested reviewers; and `attributes` holds
// `event` and `action`.
message GitHubWebhook {
  // The X-GitHub-Delivery GUID; unique in the store.
  string delivery = 1;
  // The X-GitHub-Event header.
  string event = 2;
  // The payload's `action`; empty when it has none.
  string action = 3;
  // The comment, review or issue body; at most 64 KiB, otherwise truncated.
  UntrustedText body = 4;
  // Further GitHub-written values, keyed by name: review state, merged,
  // label, check conclusion and similar.
  map<string, UntrustedText> detail = 5;
  // The verified raw JSON payload; sent only when the request sets
  // `include_payload`, for debugging.
  bytes payload = 6;
  // The link between two issues; set only for `issue_dependencies`
  // deliveries. `action` is the change: `blocked_by_added`,
  // `blocked_by_removed`, `blocking_added` or `blocking_removed`. One link
  // gives two deliveries, one per side, naming the same pair.
  IssueDependency dependency = 7;
}

// An issue dependency: the blocked issue and the issue that blocks it.
//
// A side's repository is the payload's `<side>_repo` when it has one.
// Otherwise it is the delivery's `repository` for the delivery's own side
// (blocked for `blocked_by_*`, blocking for `blocking_*`), and the owner and
// name in the issue's own `repository_url` for the far side; with neither it
// is empty, never the other side's repository.
message IssueDependency {
  // The blocked issue; unset when the payload omits it. Its repository is
  // `blocked_issue_repo`, else as the message comment says.
  ItemRef blocked = 1;
  // The blocking issue; unset when the payload omits it. Its repository is
  // `blocking_issue_repo`, else as the message comment says.
  ItemRef blocking = 2;
}

// A string that a GitHub user wrote: a title, a body, a label name, a branch
// name or review text. Every such string travels in this type, so a client
// always knows to treat it as untrusted. Logins and repository names are
// GitHub-constrained identifiers and travel as plain strings.
message UntrustedText {
  // The text, possibly cut short.
  string text = 1;
  // Whether `text` was cut short.
  bool truncated = 2;
  // The length of the text before it was cut, in bytes.
  uint32 original_length = 3;
}
