syntax = "proto3";

package mintswarm.common.v1;

// A secret value, such as a registration token, a client assertion, an
// access token or a session token. `mintswarm.runner.v1` and
// `mintswarm.auth.v1` hold it; it lives in this shared package so that both
// import one definition (design #634, B18).
//
// Never logged (the runner protocol design on #156, §9.5): `crates/proto`
// generates this message without a derived `Debug` and prints it as
// `Secret(<redacted>)`, so no message that contains a `Secret` prints its
// value. Its proto3 JSON, through `mintswarm_proto::json`, writes the value
// as `<redacted>`, and no JSON that holds a `Secret` is read.
message Secret {
  // The secret itself.
  string value = 1;
}
