# Runs every entry of gates.run in .mintswarm/config.yaml as its own check, named after the gate.
name: gates

on:
  pull_request:

permissions:
  contents: read

env:
  # Must match the yq the dogfood scripts are developed and probed against.
  YQ_VERSION: v4.45.1
  YQ_SHA256: 654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049
  # The one pin of buf; BUF_SHA256 is the release's sha256.txt entry for buf-Linux-x86_64.
  BUF_VERSION: v1.75.0
  BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b

jobs:
  matrix:
    name: gates-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gates: ${{ steps.read.outputs.gates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: yq ${{ env.YQ_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64"
          echo "$YQ_SHA256  $RUNNER_TEMP/bin/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version
      - name: Read gates.run
        id: read
        shell: bash
        run: |
          set -euo pipefail
          gates=$(yq -o=json -I=0 '.gates.run // []' .mintswarm/config.yaml)
          gates=$(jq -c '
            if type != "array" or length == 0 then error("gates.run is missing or empty") else . end
            | map(
                if (.name | type) != "string" or .name == "" then error("a gates.run entry has no name") else . end
                | if .name == "gates-matrix" then error("gate name gates-matrix is reserved for this job") else . end
                | if (.command | type) != "string" or .command == "" then error("gate \(.name) has no command") else . end
                | (.timeout // 1800) as $t
                | if ($t | type) != "number" or $t <= 0 then error("gate \(.name) has an invalid timeout") else . end
                | {name, command, timeout: $t, minutes: (($t / 60 | ceil) + 30)})
            | ([.[].name] | group_by(.) | map(select(length > 1) | .[0])) as $dups
            | if ($dups | length) > 0 then error("duplicate gate names: \($dups | join(", "))") else . end
          ' <<<"$gates")
          echo "gates=$gates" >>"$GITHUB_OUTPUT"
          jq -r '.[].name' <<<"$gates"

  gate:
    name: ${{ matrix.name }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.gates) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: yq ${{ env.YQ_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/yq" \
            "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64"
          echo "$YQ_SHA256  $RUNNER_TEMP/bin/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version
      - name: buf ${{ env.BUF_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bin/buf" \
            "https://github.com/bufbuild/buf/releases/download/$BUF_VERSION/buf-Linux-x86_64"
          echo "$BUF_SHA256  $RUNNER_TEMP/bin/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/buf"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/buf" --version)" = "${BUF_VERSION#v}"
      - name: Rust toolchain from rust-toolchain.toml
        if: hashFiles('rust-toolchain.toml') != ''
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: cargo-nextest
        if: hashFiles('rust-toolchain.toml') != ''
        env:
          # The single source of the cargo-nextest version the gates use; #286 adds it to
          # CONTRIBUTING.md and docs/conventions/rust.md. SHA256 covers the release's
          # cargo-nextest-$VERSION-x86_64-unknown-linux-gnu.tar.gz archive.
          VERSION: 0.9.152
          SHA256: d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/cargo-nextest-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/cargo-nextest.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-nextest.tar.gz" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          test "$("$RUNNER_TEMP/bin/cargo-nextest" nextest --version | awk 'NR == 1 { print $2 }')" = "$VERSION"
      - name: black at pyproject.toml's required-version
        if: hashFiles('pyproject.toml') != ''
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("black", {}).get("required-version", ""))')
          if [ -n "$version" ]; then
            pipx install "black==$version"
            black --version
          fi
      - name: Node from web/.node-version
        if: hashFiles('web/.node-version') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: pnpm from web/package.json
        if: hashFiles('web/package.json') != ''
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - name: Run the gate
        env:
          GATE_COMMAND: ${{ matrix.command }}
          GATE_TIMEOUT: ${{ matrix.timeout }}
        run: |
          set -uo pipefail
          printf 'gate command: %s\n' "$GATE_COMMAND"
          status=0
          timeout --kill-after=30 "$GATE_TIMEOUT" bash -c "$GATE_COMMAND" || status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::the gate exceeded its timeout of ${GATE_TIMEOUT} s"
          fi
          exit "$status"
