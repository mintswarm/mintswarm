# Development compose file, run from the repository root.
# webhooks: the GitHub App webhook receiver, `mintswarm-server webhooks`.
# ngrok: an ngrok agent forwarding the reserved domain to the receiver.
# Start, stop and tail them as crates/server/README.md says.
# postgres: the development database; start it with `docker compose up -d postgres`.
#
# No secret is in this file or an image: each is read from the host at run time.
# The postgres credentials below are not secrets: they are for local use only.

services:
  webhooks:
    build:
      context: .
      dockerfile: docker/webhooks/Dockerfile
    restart: unless-stopped
    # Above twice --read-timeout (20 s by default), so a stop lets the queue drain.
    stop_grace_period: 30s
    command:
      - --listen
      - 0.0.0.0:8787
      - --log
      - /var/log/mintswarm/webhooks.jsonl
      - --secret-env
      - mintswarm-dev-keeper-secret
    # Its line mintswarm-dev-keeper-secret=<value> sets the variable --secret-env names.
    # Optional, so the project loads for those who only run postgres.
    env_file:
      - path: ${HOME}/.config/mintswarm/webhook-secret
        required: false
    volumes:
      - ./build/webhooks:/var/log/mintswarm

  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    restart: unless-stopped
    depends_on: [webhooks]
    secrets: [ngrok.yml, ngrok-domain]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec ngrok http --config /run/secrets/ngrok.yml --url "$$(cat /run/secrets/ngrok-domain)" webhooks:8787

  postgres:
    # The version the test harness defaults to, crates/core/src/testing/pg/discovery.rs.
    image: postgres:17
    # Development credentials, for local use only. Connect with
    # postgres://mintswarm:mintswarm@127.0.0.1:5432/mintswarm
    environment:
      POSTGRES_USER: mintswarm
      POSTGRES_PASSWORD: mintswarm
      POSTGRES_DB: mintswarm
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

secrets:
  # ngrok's own config, which holds the auth token.
  ngrok.yml:
    file: ${NGROK_CONFIG:-${HOME}/Library/Application Support/ngrok/ngrok.yml}
  ngrok-domain:
    file: ${HOME}/.config/mintswarm/ngrok-domain
